<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0e9"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#001f4d" flood-opacity=".28"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001f4d" flood-opacity=".22"/></filter>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity=".18"/></pattern>
<pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#000" opacity=".18"/></pattern>
</defs>
<rect width="400" height="500" fill="url(#bg)"/>
<rect width="400" height="500" fill="url(#dots)"/>

<g transform="rotate(12 220 200)" filter="url(#sh)"><rect x="110" y="130" width="220" height="130" rx="10" fill="#004aad"/><g transform="translate(185 160) scale(0.7)"><rect width="100" height="100" rx="24" fill="#ffffff"/><rect x="20" y="24" width="60" height="20" rx="10" fill="#004aad"/><circle cx="70" cy="34" r="6" fill="#f15a25"/><rect x="20" y="56" width="60" height="20" rx="10" fill="#f15a25"/></g></g>
<g transform="rotate(-8 190 280)" filter="url(#sh)">
  <rect x="70" y="220" width="230" height="134" rx="10" fill="#ffffff"/>
  <g transform="translate(90 242) scale(0.4)"><rect width="100" height="100" rx="24" fill="#004aad"/><rect x="20" y="24" width="60" height="20" rx="10" fill="#ffffff"/><circle cx="70" cy="34" r="6" fill="#f15a25"/><rect x="20" y="56" width="60" height="20" rx="10" fill="#f15a25"/></g><rect x="144" y="248" width="110" height="10" rx="5.0" fill="#001f4d"/><rect x="144" y="266" width="70" height="10" rx="5.0" fill="#001f4d"/>
  <rect x="90" y="300" width="130" height="6" rx="3.0" fill="#dbe3f0"/><rect x="90" y="312" width="110" height="6" rx="3.0" fill="#dbe3f0"/><rect x="90" y="324" width="120" height="6" rx="3.0" fill="#dbe3f0"/><rect x="70" y="340" width="230" height="14" fill="#f15a25"/><rect x="70" y="346" width="230" height="8" rx="4" fill="#f15a25"/>
</g>
<g transform="rotate(-8 190 280)"><rect x="76" y="360" width="230" height="5" rx="2" fill="#dbe3f0"/><rect x="82" y="368" width="230" height="5" rx="2" fill="#b8c4d8" opacity=".7"/></g>
</svg>
